<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mydear — Login</title><link rel="stylesheet" href="assets/css/expanded.css"><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/firebase-client.js"></script></head><body><main class="wrap" style="max-width:520px;padding-top:70px"><div class="card"><div class="eyebrow">♡ Mydear</div><h1 class="title">Welcome back</h1><p class="subtitle">Log in and continue discovering people.</p><form id="login" style="display:grid;gap:12px;margin-top:20px"><input id="email" type="email" required placeholder="Email" style="padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><input id="password" type="password" required placeholder="Password" style="padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><button class="btn" type="submit">Log in</button></form><button id="google" class="btn secondary" style="margin-top:10px;width:100%">Continue with Google</button><p id="err" style="color:#dc3545;margin-top:12px"></p><p style="margin-top:18px">New here? <a href="signup.html" style="color:#ff4f87;font-weight:800">Create an account</a></p></div></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();err.textContent='';try{await fb.auth.signInWithEmailAndPassword(email.value,password.value);location.href='dashboard.html'}catch(x){err.textContent=x.message}};document.getElementById('google').onclick=async()=>{try{await fb.auth.signInWithPopup(new fb.GoogleAuthProvider());location.href='dashboard.html'}catch(x){err.textContent=x.message}};</script></body></html>
