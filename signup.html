<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mydear — Create account</title><link rel="stylesheet" href="assets/css/expanded.css"><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/firebase-client.js"></script></head><body><main class="wrap" style="max-width:520px;padding-top:70px"><div class="card"><div class="eyebrow">♡ Mydear</div><h1 class="title">Create your account</h1><p class="subtitle">Start matching with people who fit your vibe.</p><form id="signup" style="display:grid;gap:12px;margin-top:20px"><input id="name" required placeholder="Your name" style="padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><input id="email" type="email" required placeholder="Email" style="padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><input id="password" type="password" minlength="6" required placeholder="Password" style="padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><button class="btn" type="submit">Create account</button></form><p id="err" style="color:#dc3545;margin-top:12px"></p><p style="margin-top:18px">Already have an account? <a href="login.html" style="color:#ff4f87;font-weight:800">Log in</a></p></div></main><script>document.getElementById('signup').onsubmit=async e=>{e.preventDefault();err.textContent='';try{const c=await fb.auth.createUserWithEmailAndPassword(email.value,password.value);await fb.db.collection('profiles').doc(c.user.uid).set({full_name:name.value.trim(),display_name:name.value.trim(),active:true,profileComplete:false,createdAt:fb.FieldValue.serverTimestamp()},{merge:true});location.href='onboarding.html'}catch(x){err.textContent=x.message}};</script></body></html>
