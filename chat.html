<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mydear — Realtime Chat</title><link rel="stylesheet" href="assets/css/expanded.css"><link rel="stylesheet" href="assets/css/dating.css"><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/firebase-client.js"></script><script src="assets/js/chat-realtime.js"></script></head><body><main class="wrap narrow" style="padding:24px 16px 100px"><div class="top"><div><div class="eyebrow">💬 Mydear</div><h1 class="title">Realtime Chat</h1><p id="presence" class="subtitle">Connecting…</p></div><a class="btn secondary" href="matches.html">Back</a></div><div id="messages" class="card" style="min-height:55vh;max-height:60vh;overflow:auto;padding:14px"></div><div id="typing" style="height:20px;color:#ff4f87;font-size:12px;font-weight:700"></div><form id="composer" class="card" style="display:flex;gap:8px;padding:10px"><input id="text" maxlength="1000" placeholder="Type a message…" style="flex:1;padding:13px;border:1px solid #eadbe2;border-radius:14px;font:inherit"><button class="btn" type="submit">Send</button></form></main><script>
const matchId=new URLSearchParams(location.search).get('m');let me=null,unsub=null;const messages=document.getElementById('messages');const typing=document.getElementById('typing');
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function render(snap){messages.innerHTML='';snap.docs.forEach(d=>{const m=d.data();const mine=m.senderId===me.uid;const row=document.createElement('div');row.className='message '+(mine?'me':'them');row.innerHTML='<div>'+esc(m.text||'')+'</div><small style="opacity:.7">'+(m.read&&mine?'✓✓ Read':'')+'</small>';messages.appendChild(row)});messages.scrollTop=messages.scrollHeight}
async function init(){if(!matchId){messages.innerHTML='<p>Missing match ID.</p>';return}await new Promise(r=>window.fb.auth.onAuthStateChanged(u=>{me=u;r()}));if(!me){location.href='login.html';return}const ref=window.fb.db.collection('matches').doc(matchId);const snap=await ref.get();if(!snap.exists){messages.innerHTML='<p>Match not found.</p>';return}const data=snap.data();const other=data.userIds.find(x=>x!==me.uid);unsub=ref.collection('messages').orderBy('createdAt').onSnapshot(render);CHAT_REALTIME.heartbeat(matchId);CHAT_REALTIME.subscribePresence(matchId,other,p=>document.getElementById('presence').textContent=p.typing?'Typing…':p.online?'🟢 Online':'Offline');CHAT_REALTIME.subscribeTyping(matchId,other,t=>typing.textContent=t?'Typing…':'')}
document.getElementById('composer').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('text');const text=input.value.trim();if(!text||!matchId||!me)return;input.value='';const ref=window.fb.db.collection('matches').doc(matchId);const snap=await ref.get();const other=snap.data().userIds.find(x=>x!==me.uid);await ref.collection('messages').add({senderId:me.uid,text,createdAt:window.fb.FieldValue.serverTimestamp(),read:false,reactions:{},type:'text'});await ref.update({lastMessage:text,lastMessageAt:window.fb.FieldValue.serverTimestamp(),lastSenderId:me.uid,['unread.'+other]:window.fb.FieldValue.increment(1)});await CHAT_REALTIME.setTyping(matchId,false)});document.getElementById('text').addEventListener('input',()=>{if(matchId)CHAT_REALTIME.setTyping(matchId,true).catch(()=>{})});init();
</script></body></html>
